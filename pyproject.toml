[project]
name = "lookout"
version = "0.1.0"
description = "CLI that scans the competitive landscape for unknown entrants and tracks known competitors for changes"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "anthropic>=0.40",
    "resend>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
lookout = "lookout.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
